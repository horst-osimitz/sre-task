---
- hosts: localhost
  gather_facts: false
  roles:
    - role: get_private_key_from_aws_secretsmanager
- hosts: buildserver
  gather_facts: false
  become: true
  roles:
    - role: 'roles/build'
      when: enable_build == true
- hosts: webserver
  gather_facts: false
  vars:
    nginx_conf_dir: /tmp/ansible/nginx
    docker_conf_dir: /tmp/ansible/docker
    ssl_cert_dir: /tmp/ansible/nginx-cert
    certbot_webroot: /tmp/ansible/certbot/webroot
    services:
    - tweet-app
    - nginx
    domain_name: app-rgitoh.zapto.org
    email: admin@rgitoh.at
  roles:
    - role: 'roles/nginx'
    - role: 'roles/compose'
      become: true

---
- name: Ensure docker is installed
  ansible.builtin.command:
    cmd: docker --version
  register: docker_version

- name: Show docker version
  debug:
    msg: "{{docker_version.stdout}}"

- name: Create git checkout repository
  ansible.builtin.file:
    path: "{{ git_checkout_dir }}"
    state: directory
    recurse: true

- name: "Clone {{ repository }} Github Repository"
  ansible.builtin.git:
    repo: "https://github.com/{{ repository }}.git"
    dest: "{{ git_checkout_dir }}/{{ repository }}"
    single_branch: true
    version: "{{ branch }}"

- name: Build image with {{ image_tag }} tag
  become: true
  ansible.builtin.command:
    cmd: |
      docker buildx build {{ git_checkout_dir }}/{{ repository }} --tag {{ image_name }}:{{ image_tag }} --output "type=docker" --progress plain

- name: Tag image with latest tag
  become: true
  community.docker.docker_image_tag:
    name: "{{ image_name }}:{{ image_tag }}"
    repository: ["{{ image_name }}:latest"]
  when:
  - tag_image_latest is defined
  - tag_image_latest | default(false) | bool
